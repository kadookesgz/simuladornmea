name: Build EXE

on:
  push:
    branches: [desarrollo, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # necesario para adjuntar el .exe a una Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller y pyserial (salida por puerto serie)
        run: python -m pip install pyinstaller pyserial

      - name: Comprobar que el script compila
        run: python -m py_compile simulador_nmea_ais_arpa_profundidad.py

      - name: Generar .exe
        run: pyinstaller --onefile --name SimuladorNMEA --collect-submodules serial simulador_nmea_ais_arpa_profundidad.py

      - uses: actions/upload-artifact@v4
        with:
          name: SimuladorNMEA-windows
          path: dist/SimuladorNMEA.exe

      # Al subir una etiqueta (git tag v1.0 && git push --tags) se publica además como Release
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimuladorNMEA.exe
